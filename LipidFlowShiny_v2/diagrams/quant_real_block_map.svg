<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<style>
  .box { stroke-width: 1.5; }
  .outer  { fill:none; stroke:#888888; stroke-dasharray:5 4; }
  .in     { fill:#F2F2F2; stroke:#888888; }
  .fn     { fill:#EDE7F6; stroke:#6A4C93; }
  .slot   { fill:#E3EEFB; stroke:#2B6CB0; }
  .neg    { fill:#FDEDEA; stroke:#C0392B; }
  .final  { fill:#FFF3E0; stroke:#B8860B; }
  .th { font-size:13px; font-weight:700; fill:#1A1A1A; }
  .lbl { font-size:11px; font-weight:700; fill:#555555; }
  .ts { font-size:11px; fill:#444444; }
  .arr { stroke:#555555; stroke-width:1.5; fill:none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="470" fill="#FFFFFF"/>

<!-- 4 separate input blocks - NOT nested, just 4 independent pieces -->
<rect class="box in" x="20" y="30" width="150" height="50"/>
<text class="th" x="95" y="50" text-anchor="middle">is_quantification</text>
<text class="th" x="95" y="66" text-anchor="middle">_table</text>

<rect class="box in" x="180" y="30" width="150" height="50"/>
<text class="th" x="255" y="50" text-anchor="middle">lipid_quantification</text>
<text class="th" x="255" y="66" text-anchor="middle">_table</text>

<rect class="box in" x="340" y="30" width="150" height="50"/>
<text class="th" x="415" y="55" text-anchor="middle">sample_info_pos</text>

<rect class="box in" x="500" y="30" width="150" height="50"/>
<text class="th" x="575" y="55" text-anchor="middle">match_item_pos</text>

<line x1="95" y1="80" x2="270" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="80" x2="290" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="80" x2="330" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="575" y1="80" x2="350" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="200" y="120" width="200" height="44"/>
<text class="th" x="300" y="147" text-anchor="middle">get_absolute_quantification()</text>

<line x1="300" y1="164" x2="300" y2="195" class="arr" marker-end="url(#arrow)"/>

<!-- nested output block -->
<rect class="box outer" x="130" y="195" width="340" height="100" rx="10"/>
<text class="lbl" x="142" y="212">absolute_data_pos — list chứa 3 phần</text>

<rect class="box slot" x="145" y="222" width="100" height="55"/>
<text class="ts" x="195" y="245" text-anchor="middle">express_data</text>
<text class="ts" x="195" y="260" text-anchor="middle">_abs_ug_ml</text>

<rect class="box slot" x="255" y="222" width="100" height="55"/>
<text class="ts" x="305" y="245" text-anchor="middle">express_data</text>
<text class="ts" x="305" y="260" text-anchor="middle">_abs_um</text>

<rect class="box slot" x="365" y="222" width="95" height="55"/>
<text class="ts" x="412" y="245" text-anchor="middle">variable_info</text>
<text class="ts" x="412" y="260" text-anchor="middle">_abs</text>

<!-- NEG chain, compact, same structure -->
<rect class="box neg" x="530" y="195" width="130" height="100" rx="10"/>
<text class="th" x="595" y="225" text-anchor="middle">NEG</text>
<text class="ts" x="595" y="245" text-anchor="middle">(cùng cấu trúc,</text>
<text class="ts" x="595" y="260" text-anchor="middle">chạy song song)</text>

<line x1="300" y1="295" x2="330" y2="340" class="arr" marker-end="url(#arrow)"/>
<line x1="595" y1="295" x2="450" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="180" y="340" width="320" height="44"/>
<text class="th" x="340" y="367" text-anchor="middle">combine_pos_neg_quantification()</text>

<line x1="340" y1="384" x2="340" y2="410" class="arr" marker-end="url(#arrow)"/>

<rect class="box final" x="220" y="410" width="240" height="50"/>
<text class="th" x="340" y="430" text-anchor="middle">Kết quả cuối</text>
<text class="ts" x="340" y="448" text-anchor="middle">example/Result - đã gộp POS+NEG</text>
</svg>
