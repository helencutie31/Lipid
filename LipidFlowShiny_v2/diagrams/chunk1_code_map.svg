<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<style>
  .box { stroke-width: 1.5; }
  .in    { fill:#F2F2F2; stroke:#888888; }
  .fn    { fill:#EDE7F6; stroke:#6A4C93; }
  .out   { fill:#E3EEFB; stroke:#2B6CB0; }
  .state { fill:#FDEDEA; stroke:#C0392B; }
  .th { font-size:14px; font-weight:700; fill:#1A1A1A; }
  .ts { font-size:11px; fill:#444444; }
  .arr { stroke:#555555; stroke-width:1.5; fill:none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="340" fill="#FFFFFF"/>

<rect class="box in" x="240" y="30" width="200" height="40"/>
<text class="th" x="340" y="55" text-anchor="middle">md</text>

<line x1="340" y1="70" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="200" y="100" width="280" height="40"/>
<text class="th" x="340" y="125" text-anchor="middle">.lfs_peak_table(md)</text>

<line x1="340" y1="140" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="180" y="170" width="320" height="40"/>
<text class="th" x="340" y="195" text-anchor="middle">peak_table_current (reactive)</text>

<line x1="280" y1="210" x2="180" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="210" x2="500" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect class="box out" x="60" y="240" width="240" height="40"/>
<text class="th" x="180" y="265" text-anchor="middle">output$result_table</text>

<rect class="box out" x="380" y="240" width="240" height="40"/>
<text class="th" x="500" y="265" text-anchor="middle">output$download_table</text>

<rect class="box state" x="30" y="30" width="150" height="40"/>
<text class="th" x="105" y="55" text-anchor="middle">rv$work_dir</text>

<line x1="105" y1="70" x2="105" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="105" y1="240" x2="60" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="180" text-anchor="middle" transform="rotate(-90 20 180)">kiểm tra trước</text>

<rect class="box state" x="20" y="290" width="230" height="40"/>
<text class="ts" x="135" y="313" text-anchor="middle">QC plot links (nếu có work_dir)</text>
</svg>
