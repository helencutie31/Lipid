<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<style>
  .box { stroke-width: 1.5; }
  .outer  { fill:none; stroke:#888888; stroke-dasharray:5 4; }
  .mid    { fill:none; stroke:#6A4C93; stroke-dasharray:5 4; }
  .slot   { fill:#E3F3EF; stroke:#2B6E63; }
  .fn     { fill:#EDE7F6; stroke:#6A4C93; }
  .out    { fill:#E3EEFB; stroke:#2B6CB0; }
  .state  { fill:#FDEDEA; stroke:#C0392B; }
  .final  { fill:#FFF3E0; stroke:#B8860B; }
  .th { font-size:14px; font-weight:700; fill:#1A1A1A; }
  .lbl { font-size:12px; font-weight:700; fill:#555555; }
  .ts { font-size:11px; fill:#444444; }
  .arr { stroke:#555555; stroke-width:1.5; fill:none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="460" fill="#FFFFFF"/>

<!-- nested containment: variable > object > slots -->
<rect class="box outer" x="30" y="30" width="360" height="150" rx="10"/>
<text class="lbl" x="42" y="48">md — biến chứa 1 object</text>

<rect class="box mid" x="50" y="60" width="320" height="105" rx="8"/>
<text class="lbl" x="62" y="78">mass_dataset — object có nhiều slot</text>

<rect class="box slot" x="65" y="95" width="140" height="50"/>
<text class="th" x="135" y="124" text-anchor="middle">variable_info</text>

<rect class="box slot" x="220" y="95" width="140" height="50"/>
<text class="th" x="290" y="124" text-anchor="middle">expression_data</text>

<!-- flow: surface level -->
<line x1="135" y1="145" x2="250" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="145" x2="270" y2="200" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="150" y="200" width="240" height="44"/>
<text class="th" x="270" y="222" text-anchor="middle">match theo variable_id</text>
<text class="ts" x="270" y="238" text-anchor="middle">→ peak table gộp</text>

<line x1="270" y1="244" x2="270" y2="270" class="arr" marker-end="url(#arrow)"/>

<rect class="box fn" x="150" y="270" width="240" height="44"/>
<text class="th" x="270" y="297" text-anchor="middle">reactive() · 1 nguồn duy nhất</text>

<line x1="220" y1="314" x2="150" y2="345" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="314" x2="420" y2="345" class="arr" marker-end="url(#arrow)"/>

<rect class="box out" x="30" y="345" width="220" height="44"/>
<text class="th" x="140" y="372" text-anchor="middle">hiện bảng trên UI</text>

<rect class="box out" x="330" y="345" width="220" height="44"/>
<text class="th" x="440" y="372" text-anchor="middle">xuất file CSV</text>

<!-- side branch -->
<rect class="box state" x="430" y="30" width="220" height="44"/>
<text class="th" x="540" y="57" text-anchor="middle">work_dir (biến trạng thái)</text>

<line x1="540" y1="74" x2="540" y2="100" class="arr" marker-end="url(#arrow)"/>

<rect class="box state" x="430" y="100" width="220" height="44"/>
<text class="th" x="540" y="127" text-anchor="middle">kiểm tra trước khi tìm file</text>

<line x1="540" y1="144" x2="540" y2="400" class="arr" marker-end="url(#arrow)"/>

<!-- convergence -->
<path d="M140,389 L280,420" class="arr" marker-end="url(#arrow)"/>
<path d="M440,389 L360,420" class="arr" marker-end="url(#arrow)"/>

<rect class="box final" x="200" y="400" width="280" height="50"/>
<text class="th" x="340" y="420" text-anchor="middle">Kết quả cuối</text>
<text class="ts" x="340" y="438" text-anchor="middle">bug đã sửa, nhất quán, QC không im lặng</text>
</svg>
