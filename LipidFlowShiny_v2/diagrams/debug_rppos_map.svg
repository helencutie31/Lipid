<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<style>
  .box { stroke-width: 1.5; }
  .yours   { fill:#E3F3EF; stroke:#2B6E63; }
  .theirs  { fill:#EDE7F6; stroke:#6A4C93; }
  .broken  { fill:#FDEDEA; stroke:#C0392B; stroke-width: 2.5; }
  .container { fill:none; stroke:#888888; stroke-dasharray:5 4; }
  .th { font-size:13px; font-weight:700; fill:#1A1A1A; }
  .ts { font-size:11px; fill:#444444; }
  .lbl { font-size:12px; font-weight:700; }
  .depth { font-size:11px; fill:#888888; font-style: italic; }
  .arr { stroke:#555555; stroke-width:1.5; fill:none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="700" height="560" fill="#FFFFFF"/>

<!-- PHAM VI: your code -->
<rect class="box yours" x="30" y="30" width="230" height="60"/>
<text class="th" x="145" y="52" text-anchor="middle">placeholder.R</text>
<text class="ts" x="145" y="70" text-anchor="middle">input$annotate_btn</text>
<text class="lbl" x="30" y="20" fill="#2B6E63">Code của bạn</text>

<line x1="260" y1="60" x2="330" y2="60" class="arr" marker-end="url(#arrow)"/>

<!-- PHAM VI: metid package, nested depth container -->
<rect class="box container" x="330" y="15" width="340" height="530" rx="10"/>
<text class="lbl" x="345" y="10" fill="#6A4C93">Package metid - KHÔNG phải code của bạn</text>

<!-- depth ruler -->
<text class="depth" x="345" y="70">Tầng 1</text>
<rect class="box theirs" x="345" y="80" width="310" height="50"/>
<text class="th" x="500" y="100" text-anchor="middle">annotate_metabolites_mass_dataset()</text>
<text class="ts" x="500" y="118" text-anchor="middle">"No MS2 data in database"</text>

<line x1="500" y1="130" x2="500" y2="165" class="arr" marker-end="url(#arrow)"/>

<text class="depth" x="345" y="185">Tầng 2 (đi sâu hơn 1 tầng)</text>
<rect class="box theirs" x="345" y="195" width="310" height="50"/>
<text class="th" x="500" y="215" text-anchor="middle">mzIdentify_mass_dataset()</text>
<text class="ts" x="500" y="233" text-anchor="middle">(deprecated - hàm dự phòng)</text>

<line x1="500" y1="245" x2="500" y2="280" class="arr" marker-end="url(#arrow)"/>

<text class="depth" x="345" y="300">Tầng 3</text>
<rect class="box theirs" x="345" y="310" width="310" height="50"/>
<text class="th" x="500" y="335" text-anchor="middle">data("rp.pos", envir = environment())</text>

<line x1="500" y1="360" x2="500" y2="395" class="arr" marker-end="url(#arrow)"/>

<text class="depth" x="345" y="415">Tầng 4 - CHỖ VỠ THẬT</text>
<rect class="box broken" x="345" y="425" width="310" height="60"/>
<text class="th" x="500" y="448" text-anchor="middle">rp.pos dataset</text>
<text class="ts" x="500" y="466" text-anchor="middle">Không tồn tại trong metid đã cài</text>

<text class="ts" x="345" y="510" fill="#C0392B">Xác nhận: repo metid trên GitHub</text>
