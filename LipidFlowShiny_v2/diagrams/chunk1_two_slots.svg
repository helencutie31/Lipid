  .amber { fill:#FFF3E0; stroke:#B8860B; }
  .th { font-size:14px; font-weight:700; fill:#1A1A1A; }
  .tt { font-size:15px; font-weight:700; fill:#1A1A1A; }
  .ts { font-size:12px; fill:#444444; }
  .dash { stroke:#555555; stroke-width:1.5; stroke-dasharray:4 3; }
</style>
<rect width="680" height="240" fill="#FFFFFF"/>

<text class="tt" x="180" y="24" text-anchor="middle">variable_info</text>
<text class="tt" x="530" y="24" text-anchor="middle">expression_data</text>

<rect class="box hdr" x="40" y="40" width="280" height="40"/>
<text class="th" x="180" y="65" text-anchor="middle">variable_id · mz · rt</text>

<rect class="box hdr" x="400" y="40" width="260" height="40"/>
<text class="th" x="530" y="65" text-anchor="middle">(rowname) · Sample_A · Sample_B</text>

<rect class="box teal" x="40" y="80" width="280" height="40"/>
<text class="th" x="180" y="105" text-anchor="middle">P1 · 100.12 · 70</text>

<rect class="box teal" x="400" y="80" width="260" height="40"/>
<text class="th" x="530" y="105" text-anchor="middle">P1 · 1200 · 980</text>

<rect class="box amber" x="40" y="120" width="280" height="40"/>
