<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<style>
  .box { stroke-width: 1.5; }
  .hdr   { fill:#F2F2F2; stroke:#888888; }
