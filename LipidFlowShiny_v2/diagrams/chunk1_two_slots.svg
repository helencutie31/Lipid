<rect class="box amber" x="400" y="120" width="260" height="40"/>
<text class="th" x="530" y="145" text-anchor="middle">P2 · 340 · 510</text>

<line x1="320" y1="100" x2="400" y2="100" class="dash"/>
<line x1="320" y1="140" x2="400" y2="140" class="dash"/>

<text class="ts" x="340" y="190" text-anchor="middle">Khớp qua cùng 1 giá trị nhận diện:</text>
<text class="ts" x="340" y="208" text-anchor="middle">cột variable_id (trái) = tên dòng / rowname (phải)</text>
</svg>
